version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      # Conventional Commits, checked in CI: "build(deps): ..." and "build(deps-dev): ...".
      prefix: build
      include: scope
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # The .NET major version is a deliberate choice; Microsoft packages get minor and patch updates only.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      # Serilog.AspNetCore and Serilog.Extensions.* majors follow the .NET major and pull Microsoft.Extensions.* with them.
      - dependency-name: "Serilog.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/"
      - "/mocks/CSharpApp.UpstreamMock"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The .NET major version is a deliberate choice.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
